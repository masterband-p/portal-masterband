<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Masterband · Tablero de Trabajos</title>
<style>
  :root{
    --rojo:#C0001A; --rojo-d:#8f0013; --rojo-l:#F5E6E9;
    --ink:#1A1D23; --dim:#6B7280; --mut:#9AA1AC;
    --bg:#F4F5F7; --surface:#FFFFFF; --border:#E6E8EC; --border2:#EFF0F3;
    --verde:#1E9E57; --verde-l:#E7F6EE; --azul:#3B6FD4; --azul-l:#E8EFFB;
    --naranja:#E8803A; --naranja-l:#FDEEE2; --amber:#B45309; --amber-l:#FEF3C7;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    --sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 22px}
  .brand{font-weight:800;font-size:15px}
  .brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .wrap{max-width:1500px;margin:0 auto;padding:20px 22px 60px}

  /* Login (acceso directo) */
  .overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
  .overlay.off{display:none}
  .card-login{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:30px;width:340px;box-shadow:var(--sh)}
  .card-login h1{font-size:17px;margin-bottom:4px}
  .card-login p{color:var(--mut);font-size:13px;margin-bottom:18px}
  .lbl{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:12px 0 5px}
  select,input[type=password]{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:14px;font-family:var(--font);outline:none}
  .mbtn{width:100%;margin-top:18px;background:var(--rojo);color:#fff;border:none;border-radius:9px;padding:12px;font-weight:700;font-size:14px;cursor:pointer}
  .mbtn:hover{background:var(--rojo-d)}
  .perr{color:var(--rojo);font-size:12px;margin-top:8px;min-height:14px}

  /* Cabecera de la vista */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .title{font-size:20px;font-weight:800}
  .subtitle{color:var(--mut);font-size:13px;margin-top:2px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 18px}
  .fbtn{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer}
  .fbtn.on{background:var(--rojo-l);border-color:#E7B9C1;color:var(--rojo-d)}
  .btn-upd{margin-left:auto;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
  .btn-upd.busy{opacity:.6;pointer-events:none}

  /* Leyenda de control visual */
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--dim);margin-bottom:18px}
  .legend .li{display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  .dot.proy{background:var(--rojo)} .dot.mant{background:var(--naranja)} .dot.otra{background:var(--mut)}
  .legend .al{display:inline-flex;align-items:center;gap:5px;font-weight:700}

  /* Tablero Kanban */
  .board{display:grid;gap:14px;grid-template-columns:repeat(var(--ncols),minmax(240px,1fr));align-items:start}
  @media(max-width:1100px){.board{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(260px,78vw);overflow-x:auto;padding-bottom:12px}}
  .col{background:#EEF0F3;border:1px solid var(--border);border-radius:12px;padding:10px;min-height:120px}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px}
  .col-name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
  .col-bar{width:4px;height:16px;border-radius:3px;display:inline-block}
  .col-cnt{background:var(--surface);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:800;padding:2px 10px;color:var(--dim)}
  .col-sub{font-size:11px;color:var(--mut);padding:0 6px 8px}

  .kcard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--mut);border-radius:9px;padding:11px 12px;margin-bottom:10px;box-shadow:var(--sh);position:relative}
  .kcard.proy{border-left-color:var(--rojo)} .kcard.mant{border-left-color:var(--naranja)}
  .kcard.alerta{outline:2px solid var(--rojo);outline-offset:-2px}
  .kcard .num{font-size:11px;font-weight:800;color:var(--rojo);letter-spacing:.03em}
  .kcard .desc{font-size:13.5px;font-weight:700;margin:3px 0 7px;line-height:1.3}
  .kcard .meta{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
  .kcard .meta b{color:var(--ink);font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid transparent}
  .chip.gris{background:#F1F2F4;color:var(--dim);border-color:var(--border)}
  .chip.verde{background:var(--verde-l);color:#15733f;border-color:#BFE6CF}
  .chip.azul{background:var(--azul-l);color:#2451a6;border-color:#C3D6F5}
  .chip.amber{background:var(--amber-l);color:var(--amber);border-color:#F3D38A}
  .chip.rojo{background:var(--rojo-l);color:var(--rojo-d);border-color:#E7B9C1}
  .col-empty{text-align:center;color:var(--mut);font-size:12px;padding:18px 6px}

  .aviso{background:var(--amber-l);border:1px solid #F0C040;border-radius:10px;padding:12px 16px;font-size:13px;color:#7A5C00;margin:16px 0}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand">Masterband S.A.S.<small>Tablero de trabajos</small></div>
</div>

<div class="wrap" id="app">
  <div class="head">
    <div>
      <div class="title">Trabajos en ejecución</div>
      <div class="subtitle" id="subtitle">Control visual del flujo operativo</div>
    </div>
  </div>

  <div class="toolbar" id="areas"></div>

  <div class="legend">
    <span class="li"><span class="dot proy"></span> Proyectos</span>
    <span class="li"><span class="dot mant"></span> Mantenimiento</span>
    <span class="li"><span class="dot otra"></span> Otra área</span>
    <span class="li al" style="color:var(--rojo-d)">⚠ Requiere atención (demorado / acta vencida / sin NE)</span>
  </div>

  <div class="board" id="board" style="--ncols:3"></div>
  <div id="vacio"></div>
</div>

<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbw8rE7Wemj-RU-jfu9BqVb_i0FyeMvfVZtDtJHdyEwyz-JsPWNbXatPf13AHG_vG7OS/exec";
const ETAPAS = ['Pendiente','Enviada','Aprobada','OC recibida','En proceso','Finalizado','Facturado'];

// Columnas del tablero según el rol
const COLS_SUP = [
  {key:'iniciar',  nombre:'Por iniciar',  etapa:3, color:'var(--mut)',    sub:'OC recibida, aún sin arrancar'},
  {key:'ejecucion',nombre:'En ejecución', etapa:4, color:'var(--azul)',   sub:'Trabajo en campo ahora'},
  {key:'finalizado',nombre:'Finalizado',  etapa:5, color:'var(--verde)',  sub:'Terminado, pendiente acta / NE'}
];
const COLS_FULL = COLS_SUP.concat([
  {key:'facturado',nombre:'Facturado',    etapa:6, color:'var(--rojo)',   sub:'Ciclo cerrado'}
]);

let rolActual = '';
let OTS = [];
let areaFiltro = 'todos';

/* ---------- MAPEO DE DATOS (idéntico a Órdenes de Trabajo) ---------- */
function gc(row, i){ return String(row[i] || '').trim(); }
function parseMonto(v){
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  let s = String(v||'').replace(/[^0-9.,]/g,'');
  if (!s) return 0;
  const tienePunto = s.indexOf('.')>=0, tieneComa = s.indexOf(',')>=0;
  if (tienePunto && tieneComa){ s = s.replace(/\./g,'').replace(',','.'); }
  else if (tieneComa){ s = s.replace(',','.'); }
  else if (tienePunto){ const p=s.split('.'),u=p[p.length-1]; if(p.length>2||u.length===3) s=s.replace(/\./g,''); }
  const n = parseFloat(s); return isNaN(n)?0:n;
}
function parseFechaDMA(s){
  if(!s) return null; s=String(s).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}
function diasEntre(desde, hasta){
  const a = parseFechaDMA(desde); if(!a) return null;
  const b = hasta ? parseFechaDMA(hasta) : new Date();
  if(!b) return null;
  a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  return Math.max(0, Math.round((b-a)/864e5));
}
function mapEtapa(estado, apro, noOC, etrab, facturado, nfact){
  const e=(estado||'').toLowerCase().trim(), a=(apro||'').toLowerCase().trim();
  const t=(etrab||'').toLowerCase().trim(), f=(facturado||'').toLowerCase().trim();
  const nf=(nfact||'').trim();
  const tieneFacturaReal = /\d{3,}/.test(nf) && !/pdte|pend|validar|revisar|no\.?\s*e|falta/i.test(nf);
  if (f==='si'||f==='sí'||tieneFacturaReal) return 6;
  if (t==='finalizado') return 5;
  if (t==='en proceso' && (noOC||'').trim()) return 4;
  if ((noOC||'').trim()) return 3;
  if (a==='si'||a==='sí') return 2;
  if (e==='enviada') return 1;
  return 0;
}
function nePresente(ne){ return /\d/.test(String(ne||'')) && !/pdte|pend|falta|validar/i.test(String(ne||'')); }
function rowToOT(row){
  const celdaA = gc(row,0);
  if (/[a-zA-Z]/.test(celdaA)) return null;
  if (/\d{4}-\d{2}-\d{2}T/.test(celdaA) || celdaA.includes('T05:00') || celdaA.includes('T04:')) return null;
  if (!celdaA) return null;
  const num = celdaA.replace(/[^0-9]/g,'');
  if (!num || num.length<3 || num.length>6) return null;
  const anio=gc(row,1).replace('.0','');
  const estado=gc(row,8), apro=gc(row,9), noOC=gc(row,10), etrab=gc(row,11);
  const fact=gc(row,13), nfact=gc(row,15);
  const fechaIni=gc(row,17), fechaFin=gc(row,18);
  return {
    id:'CTZ'+num+'-'+anio, num, anio,
    colilla:gc(row,2)||'Sin descripción',
    cliente:gc(row,4)||'—', contacto:gc(row,5)||'—',
    area:gc(row,6)||'N/A',
    noOC, etrab, costo:parseMonto(row[12])||0,
    facturado:fact,
    acta:(()=>{const v=gc(row,14).toUpperCase();return v==='SI'||v==='SÍ';})(),
    ne:gc(row,16), fechaIni, fechaFin, obs:gc(row,19),
    etapa:mapEtapa(estado,apro,noOC,etrab,fact,nfact)
  };
}

/* ---------- CARGA ---------- */
async function cargar(){
  const btn=document.getElementById('btn-upd'); if(btn){ btn.classList.add('busy'); btn.textContent='⟳ Actualizando...'; }
  try{
    const res = await fetch(BACKEND + '?nocache=' + Date.now(), {cache:'no-store'});
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error('Formato inesperado');
    const imp=[]; for(let i=1;i<data.length;i++){ const o=rowToOT(data[i]); if(o) imp.push(o); }
    OTS = imp;
    render();
  }catch(e){
    document.getElementById('board').innerHTML='';
    document.getElementById('vacio').innerHTML='<div class="aviso">No se pudieron cargar los trabajos: '+e.message+'</div>';
  }finally{
    if(btn){ btn.classList.remove('busy'); btn.textContent='⟳ Actualizar'; }
  }
}

/* ---------- RENDER ---------- */
function colsDeRol(){ return rolActual==='supervisor' ? COLS_SUP : COLS_FULL; }

function render(){
  // Barra de áreas + botón actualizar
  const areas = Array.from(new Set(OTS.map(o=>o.area).filter(a=>a&&a!=='N/A'))).sort();
  const fAreas = ['todos'].concat(areas);
  document.getElementById('areas').innerHTML =
    fAreas.map(a=>`<button class="fbtn ${areaFiltro===a?'on':''}" onclick="setArea('${a.replace(/'/g,"\\'")}')">${a==='todos'?'Todas las áreas':a}</button>`).join('')
    + '<button class="btn-upd" id="btn-upd" onclick="cargar()">⟳ Actualizar</button>';

  const cols = colsDeRol();
  document.getElementById('board').style.setProperty('--ncols', cols.length);
  const base = areaFiltro==='todos' ? OTS : OTS.filter(o=>o.area===areaFiltro);

  document.getElementById('subtitle').textContent =
    rolActual==='supervisor'
      ? 'Control visual de los trabajos en campo — enfócate en la columna "En ejecución"'
      : 'Control visual del flujo: desde que llega la OC hasta que se factura';

  let html='';
  cols.forEach(c=>{
    const items = base.filter(o=>o.etapa===c.etapa);
    // Orden: los que requieren atención primero
    items.sort((a,b)=> (prioridad(b,c)-prioridad(a,c)));
    html += `<div class="col">
      <div class="col-head">
        <div class="col-name"><span class="col-bar" style="background:${c.color}"></span>${c.nombre}</div>
        <span class="col-cnt">${items.length}</span>
      </div>
      <div class="col-sub">${c.sub}</div>
      ${items.length ? items.map(o=>tarjeta(o,c)).join('') : '<div class="col-empty">Sin trabajos</div>'}
    </div>`;
  });
  document.getElementById('board').innerHTML = html;
  document.getElementById('vacio').innerHTML = base.length ? '' : '<div class="aviso">No hay trabajos para esta área.</div>';
}

// Nivel de urgencia de una tarjeta (para ordenar y para marcar alerta)
function prioridad(o, c){
  if(c.key==='ejecucion'){ const d=diasEntre(o.fechaIni, o.fechaFin||null); return (d!=null && d>15)?d:0; }
  if(c.key==='finalizado'){
    const d=diasEntre(o.fechaFin, null);
    if(!o.acta && d!=null && d>5) return 1000+d;   // acta vencida
    if(o.acta && !nePresente(o.ne)) return 500;     // falta NE
    return 0;
  }
  if(c.key==='iniciar'){ return o.fechaIni ? 0 : 1; }
  return 0;
}

function claseArea(a){ a=(a||'').toLowerCase(); if(a.includes('proyec'))return 'proy'; if(a.includes('mant'))return 'mant'; return ''; }

function tarjeta(o, c){
  let chips='', alerta=false;

  if(c.key==='ejecucion'){
    const d=diasEntre(o.fechaIni, null);
    if(d!=null){ const tarde=d>15; if(tarde) alerta=true;
      chips += `<span class="chip ${tarde?'rojo':'azul'}">${tarde?'⏱ ':''}${d} día${d===1?'':'s'} en campo</span>`; }
    else chips += `<span class="chip gris">Sin fecha inicio</span>`;
  }
  else if(c.key==='finalizado'){
    const d=diasEntre(o.fechaFin, null);
    if(!o.acta){
      const venc = d!=null && d>5; if(venc) alerta=true;
      chips += `<span class="chip ${venc?'rojo':'amber'}">${venc?'⚠ ':''}Acta pendiente${d!=null?` (${d}d)`:''}</span>`;
    } else {
      chips += `<span class="chip verde">✓ Acta</span>`;
      if(nePresente(o.ne)) chips += `<span class="chip azul">NE ${o.ne}</span>`;
      else { alerta=true; chips += `<span class="chip rojo">⚠ Falta NE</span>`; }
    }
  }
  else if(c.key==='iniciar'){
    if(!o.fechaIni){ alerta=true; chips += `<span class="chip rojo">⚠ Por arrancar</span>`; }
    else chips += `<span class="chip gris">Inicia ${o.fechaIni}</span>`;
  }
  else if(c.key==='facturado'){
    chips += `<span class="chip verde">✓ Facturado</span>`;
  }

  const ocTxt = o.noOC ? `<span>OC: <b>${o.noOC}</b></span>` : '';
  return `<div class="kcard ${claseArea(o.area)} ${alerta?'alerta':''}">
    <div class="num">CTZ ${o.num}-${o.anio} · ${o.area}</div>
    <div class="desc">${o.colilla}</div>
    <div class="meta">
      <span>Cliente: <b>${o.cliente}</b></span>
      ${ocTxt}
    </div>
    <div class="chips">${chips}</div>
  </div>`;
}

function setArea(a){ areaFiltro=a; render(); }

/* ---------- INICIO: toma el rol del portal (no se pide aquí) ---------- */
(function(){
  var q=new URLSearchParams(location.search);
  var embed=q.get('embed')==='1';
  var rol=q.get('rol')||'';
  if(embed){
    // Dentro del portal: se oculta la cabecera propia para no duplicar
    var st=document.createElement('style');
    st.textContent='.topbar{display:none!important}.wrap{padding-top:14px}';
    document.head.appendChild(st);
  }
  window.addEventListener('load',function(){
    // Rol válido viene del portal; si se abre directo, muestra el flujo completo
    rolActual = (['gerencia','ingeniero','supervisor'].indexOf(rol)>=0) ? rol : 'gerencia';
    cargar();
  });
})();
</script>
</body>
</html>
