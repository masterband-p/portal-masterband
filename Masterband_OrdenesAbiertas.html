<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Órdenes Abiertas — Masterband</title>
<style>
  :root{
    --rojo:#C0001A; --rojo-d:#8f0013; --rojo-l:#F5E6E9;
    --text:#1A1A1A; --dim:#666; --bg:#F5F5F3; --surface:#FFFFFF;
    --border:#E2E2DF; --verde:#1E7A3E; --verde-l:#E7F3EC;
    --amber:#B45309; --amber-l:#FEF3C7;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;padding:16px}
  .wrap{max-width:1000px;margin:0 auto}
  .top{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:16px}
  .bmark{width:42px;height:42px;background:linear-gradient(135deg,#1A1A1A,#444);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bmark b{color:#fff;font-size:20px;font-weight:800;letter-spacing:-1px}
  .bmark b span{color:var(--rojo)}
  .top h1{font-size:18px;font-weight:700;line-height:1.2}
  .top p{font-size:12.5px;color:var(--dim)}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:13px;color:var(--dim)}
  .tab.on{background:var(--rojo);border-color:var(--rojo);color:#fff}

  .sumbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .sb{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .sb span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
  .sb b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}

  .orden{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
  .ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .ohead h3{font-size:15px;font-weight:700}
  .ohead .meta{font-size:12px;color:var(--dim);margin-top:3px}
  .saldo{text-align:right}
  .saldo span{font-size:11px;color:var(--dim);text-transform:uppercase}
  .saldo b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .saldo b.ok{color:var(--verde)} .saldo b.low{color:var(--amber)} .saldo b.neg{color:var(--rojo)}

  .barra{height:7px;border-radius:999px;background:#eee;margin:12px 0 6px;overflow:hidden}
  .barra > i{display:block;height:100%;background:var(--rojo)}
  .mini{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}

  .hijas{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
  .hijas table{width:100%;border-collapse:collapse;font-size:12.5px}
  .hijas td{padding:6px 4px;border-bottom:1px solid #f0f0ee}
  .hijas td.r{text-align:right;font-variant-numeric:tabular-nums}
  .bcli{display:inline-block;font-size:10px;font-weight:700;background:var(--verde-l);color:var(--verde);padding:1px 7px;border-radius:5px;margin-left:6px}

  .acc{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{border:none;border-radius:9px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-calc{background:var(--rojo);color:#fff}
  .btn-calc:hover{background:var(--rojo-d)}
  .toggle{background:var(--surface);color:var(--dim);border:1px solid var(--border)}

  .load,.empty{text-align:center;color:var(--dim);padding:40px 20px}
  .foot{text-align:center;color:var(--dim);font-size:11px;margin:20px 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="bmark"><b>M<span>B</span></b></div>
    <div>
      <h1>Órdenes Abiertas</h1>
      <p>Saldo disponible por orden · estime y solicite nuevos trabajos</p>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-a="servicio">Servicio</div>
    <div class="tab" data-a="empaque">Empaque</div>
    <div class="tab" data-a="proceso">Proceso</div>
    <div class="tab" data-a="ingenieria">Ingeniería</div>
  </div>

  <div class="sumbar" id="sumbar"></div>
  <div id="lista"><div class="load">Cargando órdenes…</div></div>

  <p class="foot">Montajes Industriales Masterband S.A.S. · Los saldos se actualizan al aprobarse cada solicitud.</p>
</div>

<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbw8rE7Wemj-RU-jfu9BqVb_i0FyeMvfVZtDtJHdyEwyz-JsPWNbXatPf13AHG_vG7OS/exec";
const CALC = "Masterband_CotizadorServicio.html";   // misma carpeta
let AREA = "servicio";
const COP = n => "$" + Math.round(+n||0).toLocaleString("es-CO");

function diag(titulo, detalle){
  document.getElementById("sumbar").innerHTML="";
  document.getElementById("lista").innerHTML =
    '<div class="orden"><h3 style="color:var(--rojo)">'+titulo+'</h3>'+
    '<p style="color:var(--dim);font-size:13px;margin-top:8px;line-height:1.6">'+detalle+'</p>'+
    '<div class="acc"><button class="btn btn-calc" onclick="cargar()">🔄 Reintentar</button></div></div>';
}

async function cargar(){
  document.getElementById("lista").innerHTML='<div class="load">Cargando órdenes…</div>';
  document.getElementById("sumbar").innerHTML="";
  let j;
  try{
    const r = await fetch(BACKEND+"?tabla=ordenes_area&area="+AREA+"&t="+Date.now());
    j = await r.json();
  }catch(e){
    diag("No se pudo conectar con el servidor",
      "Verifica tu conexión a internet. Importante: abre esta página desde el <b>portal en GitHub</b> "+
      "(https://masterband-p.github.io/...), no como archivo local — al abrirla con doble clic el navegador "+
      "puede bloquear la lectura de datos del servidor.");
    return;
  }
  // El backend respondió pero NO con la ruta de órdenes (devolvió otra cosa):
  if(Array.isArray(j) || typeof j.ok === "undefined"){
    diag("El backend no tiene publicada la ruta de órdenes",
      "El servidor respondió, pero sin los datos de órdenes abiertas. Esto pasa cuando el código nuevo está "+
      "en el editor de Apps Script pero no se ha <b>publicado como Nueva versión</b>.<br><br>"+
      "Solución: Apps Script → <b>Implementar → Gestionar implementaciones → ✏️ → Versión: Nueva versión → Implementar</b>. "+
      "Luego verifica abriendo <code>…/exec?tabla=version</code> (debe decir <b>v47-ordenes-supervisadas</b>).");
    return;
  }
  if(!j.ok){ diag("No se pudo cargar", (j.error||j.aviso||"Respuesta inesperada del servidor.")); return; }

  const cortes = j.cortes||[];
  if(!cortes.length){
    document.getElementById("lista").innerHTML='<div class="empty">No hay órdenes abiertas en esta área'+
      (j.aviso?('<br><span style="font-size:12px">'+j.aviso+'</span>'):'')+'.</div>';
    return;
  }
  render(cortes);
}

function render(cortes){
  // Resumen
  let saldoTotal=0, usadoTotal=0, montoTotal=0;
  cortes.forEach(c=>{ saldoTotal += (c.saldo!=null?c.saldo:0); usadoTotal += (c.usado||0); montoTotal += (c.monto||0); });
  document.getElementById("sumbar").innerHTML = `
    <div class="sb"><span>Órdenes</span><b>${cortes.length}</b></div>
    <div class="sb"><span>Contratado</span><b>${COP(montoTotal)}</b></div>
    <div class="sb"><span>Consumido</span><b style="color:var(--amber)">${COP(usadoTotal)}</b></div>
    <div class="sb"><span>Saldo disponible</span><b style="color:var(--verde)">${COP(saldoTotal)}</b></div>`;

  document.getElementById("lista").innerHTML = cortes.map((c,i)=>orden(c,i)).join("");
}

function orden(c,i){
  const saldo = c.saldo!=null ? c.saldo : (c.monto - (c.usado||0));
  const monto = c.monto||0;
  const pct = monto>0 ? Math.min(100, Math.round((c.usado||0)/monto*100)) : 0;
  let cls = "ok"; if(saldo<=0) cls="neg"; else if(monto>0 && saldo/monto<0.15) cls="low";

  const hijas = (c.hijas||[]).map(h=>`
    <tr><td>${(h.observacion||h.ctz||"").toString().replace(/</g,"&lt;")}${h.origen==='cliente'?'<span class="bcli">Cliente</span>':''}</td>
        <td class="r">${COP(h.costo)}</td></tr>`).join("");

  const btnCalc = AREA==="servicio"
    ? `<a class="btn btn-calc" href="${CALC}?orden=${encodeURIComponent(c.ctz)}" target="_blank">🧮 Calcular y añadir servicio</a>`
    : `<span class="btn toggle" style="cursor:default">🧮 Calculadora disponible próximamente</span>`;

  return `<div class="orden">
    <div class="ohead">
      <div>
        <h3>Orden N° ${c.ctz}</h3>
        <div class="meta">${(c.observacion||"").toString().replace(/</g,"&lt;")||"—"}${c.solicito?(" · "+c.solicito):""}${c.fecha?(" · "+c.fecha):""}</div>
      </div>
      <div class="saldo"><span>Saldo</span><b class="${cls}">${COP(saldo)}</b></div>
    </div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <div class="mini"><span>Contratado ${COP(monto)}</span><span>Consumido ${COP(c.usado||0)} (${pct}%)</span></div>
    ${hijas ? `<div class="hijas" id="h_${i}" style="display:none"><table>${hijas}</table></div>
      <div class="acc"><button class="btn toggle" onclick="tg(${i},this)">Ver ${(c.hijas||[]).length} consumo(s)</button>${btnCalc}</div>`
      : `<div class="acc">${btnCalc}</div>`}
    ${c.acumulado!=null?`<div class="mini" style="margin-top:8px"><span>Saldo acumulado</span><span>${COP(c.acumulado)}</span></div>`:""}
  </div>`;
}

function tg(i,btn){
  const el=document.getElementById("h_"+i);
  const open = el.style.display==="none";
  el.style.display = open?"block":"none";
  btn.textContent = open ? "Ocultar consumos" : "Ver consumos";
}

document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); AREA=t.dataset.a; cargar();
});
cargar();
</script>
</body>
</html>
