<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<title>Portal Masterband</title>
<style>
  :root{
    --rojo:#C0001A; --rojo-d:#8f0013; --rojo-l:#F5E6E9;
    --ink:#1A1D23; --dim:#6B7280; --mut:#9AA1AC;
    --bg:#F4F5F7; --surface:#FFFFFF; --border:#E6E8EC; --border2:#EFF0F3;
    --verde:#1E9E57; --verde-l:#E7F6EE; --azul:#3B6FD4; --naranja:#E8803A; --amber:#B45309; --amber-l:#FEF3C7;
    --sb:#FFFFFF; --sb-active:#F5E6E9; --sb-ink:#374151;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  button{font-family:var(--font);cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ---------- LOGIN ---------- */
  #login{position:fixed;inset:0;background:linear-gradient(135deg,#1A1D23,#2b2f38);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .lcard{background:var(--surface);border-radius:18px;max-width:420px;width:100%;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .llogo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .llogo img{height:40px}
  .lcard h1{font-size:18px;font-weight:700}
  .lcard .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .role{border:1.5px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;transition:all .15s;background:var(--surface)}
  .role:hover{border-color:var(--rojo);background:var(--rojo-l)}
  .role.on{border-color:var(--rojo);background:var(--rojo-l);box-shadow:0 0 0 3px rgba(192,0,26,.08)}
  .role .ic{color:var(--ink);margin-bottom:2px}
  .role.on .ic,.role:hover .ic{color:var(--rojo)}
  .navitem .ic{color:inherit;display:inline-flex;align-items:center}
  .navsec .lbl svg{opacity:.7;margin-right:2px}
  .role .nm{font-weight:700;font-size:13.5px;margin-top:4px}
  .role .ds{font-size:11px;color:var(--dim)}
  .lfield{margin-bottom:14px}
  .lfield label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
  .lfield input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;outline:none;transition:border .15s}
  .lfield input:focus{border-color:var(--rojo)}
  .lbtn{width:100%;background:var(--rojo);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;transition:background .15s}
  .lbtn:hover{background:var(--rojo-d)}
  .lerr{color:var(--rojo);font-size:12.5px;margin-top:10px;min-height:16px;text-align:center}

  /* ---------- APP SHELL ---------- */
  #app{display:none;height:100vh}
  .shell{display:grid;grid-template-columns:238px 1fr;grid-template-rows:62px 1fr;height:100vh;grid-template-areas:"side top" "side main"}
  @media(max-width:820px){
    .shell{grid-template-columns:1fr;grid-template-areas:"top" "main"}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:238px;z-index:40;transform:translateX(-100%);transition:transform .22s}
    .sidebar.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none}
    .scrim.on{display:block}
    .burger{display:inline-flex!important}
  }

  /* Topbar */
  .topbar{grid-area:top;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px}
  .burger{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-size:16px}
  .tb-logo{height:32px;width:auto;display:block}
  .tb-div{width:1px;height:30px;background:var(--border);margin:0 2px}
  .topbar .ttl{font-weight:700;font-size:14.5px;color:var(--ink)}
  .topbar .ttl small{display:block;font-weight:400;color:var(--dim);font-size:11.5px}
  .topbar .sp{margin-left:auto}
  .iconbtn{width:38px;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
  .iconbtn:hover{border-color:var(--rojo);color:var(--rojo)}
  .syncbtn{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
  .syncbtn:hover{border-color:var(--rojo);color:var(--rojo)}
  .userbox{display:flex;align-items:center;gap:10px}
  .userbox .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#1f2733,#394559);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .userbox .ui{text-align:right;line-height:1.25}
  .userbox .ui b{display:block;font-size:13px}
  .userbox .ui span{font-size:11.5px;color:var(--dim)}
  .logout{border:1px solid var(--border);background:var(--surface);color:var(--rojo);border-radius:9px;padding:9px 14px;font-weight:600;font-size:12.5px}
  .logout:hover{background:var(--rojo-l);border-color:var(--rojo)}
  @media(max-width:700px){ .topbar .ttl,.syncbtn,.tb-div,.userbox .ui{display:none} }

  /* Hero banner (corporativo) */
  .hero{background:linear-gradient(120deg,#141922 0%,#1d2635 55%,#242f42 100%);border-radius:16px;padding:26px 30px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(20,25,34,.22)}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(192,0,26,.28),transparent 70%)}
  .hero h2{font-size:23px;font-weight:800;position:relative}
  .hero .sub{color:#AEB6C4;font-size:13px;margin-top:3px;position:relative}
  .hero .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
  .hero .chip2{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 13px;font-size:12.5px;color:#E6E9EF;display:inline-flex;align-items:center;gap:7px}
  .hero .chip2 b{color:#fff}

  /* KPI cards (con acción) */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .kpi .kh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--dim)}
  .kpi .kh .kd{width:9px;height:9px;border-radius:50%}
  .kpi .kv{font-size:28px;font-weight:800;margin:8px 0 2px;color:var(--ink)}
  .kpi .ks{font-size:12px;color:var(--mut)}
  .kpi .ka{margin-top:12px;font-size:12px;color:var(--rojo);font-weight:700;cursor:pointer;display:inline-block}
  .sechead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:4px 0 14px;color:var(--ink)}

  /* Sidebar */
  .sidebar{grid-area:side;background:var(--sb);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
  .sbrand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border2)}
  .sbrand img{height:30px}
  .sbrand b{font-size:13px;font-weight:800;letter-spacing:-.2px}
  .sbrand b span{color:var(--rojo)}
  .navsec{padding:14px 12px 4px}
  .navsec .lbl{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;padding:0 8px 6px}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--sb-ink);font-weight:500;font-size:13.5px;cursor:pointer;transition:all .13s;margin-bottom:2px;position:relative}
  .navitem:hover{background:#F7F7F9}
  .navitem.on{background:var(--sb-active);color:var(--rojo);font-weight:700}
  .navitem.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--rojo)}
  .navitem .ic{width:20px;text-align:center;font-size:15px;flex-shrink:0}
  .navitem .code{margin-left:auto;font-size:9.5px;color:var(--mut);font-weight:600}
  .sfoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border2);font-size:10.5px;color:var(--mut)}

  /* Main */
  .main{grid-area:main;overflow:auto;position:relative}
  .pagepad{padding:22px 26px}
  @media(max-width:560px){.pagepad{padding:16px}}
  .phead{margin-bottom:18px}
  .phead h2{font-size:20px;font-weight:700}
  .phead p{color:var(--dim);font-size:13px}

  iframe.modframe{width:100%;height:100%;border:none;display:block;background:var(--bg)}

  /* Tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center}
  .tile .dot{width:30px;height:30px;border-radius:50%;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
  .tile b{font-size:26px;font-weight:800}
  .tile span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

  /* Dashboard module cards */
  .mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .modcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .13s,box-shadow .13s;position:relative;overflow:hidden}
  .modcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.1)}
  .modcard .mic{width:42px;height:42px;border-radius:11px;background:var(--rojo-l);color:var(--rojo);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .modcard h3{font-size:14.5px;font-weight:700}
  .modcard p{font-size:12px;color:var(--dim);margin-top:3px}
  .modcard .code{position:absolute;top:14px;right:14px;font-size:10px;color:var(--mut);font-weight:700}
  .modcard .go{margin-top:12px;font-size:12px;color:var(--rojo);font-weight:700}

  /* Calendar */
  .calbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .calbar .mn{font-size:17px;font-weight:700;min-width:150px;text-align:center}
  .navb{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px}
  .navb:hover{border-color:var(--rojo);color:var(--rojo)}
  .cal{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .calhead,.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
  .calhead div{padding:10px 6px;text-align:center;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border)}
  .cell{min-height:92px;border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:7px 8px;cursor:pointer;transition:background .12s;position:relative}
  .cell:hover{background:#FAFAFB}
  .cell.empty{background:#FCFCFD;cursor:default}
  .cell .dnum{font-size:12.5px;font-weight:600;color:var(--ink)}
  .cell.today{background:#F0F4FF}
  .cell.today .dnum{color:var(--azul)}
  .cell.festivo{background:#F6F2FF}
  .cell.festivo .fest{font-size:9px;color:#7C3AED;font-weight:700}
  .cell .ev{margin-top:4px;display:flex;flex-direction:column;gap:3px}
  .chip{font-size:10.5px;background:var(--rojo-l);color:var(--rojo);border-radius:5px;padding:2px 6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.mas{background:#EEF1F6;color:#4B5563}
  .cell .ina{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--rojo)}
  .leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--dim)}
  .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

  .empty-s{text-align:center;color:var(--dim);padding:40px}
  .loading{text-align:center;color:var(--dim);padding:40px}

  /* Day detail modal */
  dialog{border:none;border-radius:16px;padding:0;max-width:520px;width:94%;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlgh{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .dlgh h3{font-size:16px}
  .dlgh button{border:none;background:none;font-size:20px;color:var(--dim)}
  .dlgb{padding:14px 22px 22px;max-height:60vh;overflow:auto}
  .fr{border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:10px}
  .fr .frt{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .fr h4{font-size:14px}
  .fr .hr{font-size:12px;font-weight:700;color:var(--rojo);background:var(--rojo-l);padding:2px 9px;border-radius:999px}
  .fr .meta{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.6}
  .fr .tag{display:inline-block;font-size:10.5px;background:#EEF1F6;color:#4B5563;border-radius:5px;padding:1px 7px;margin-right:4px}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="lcard">
    <div class="llogo"><img src="logo-masterband.png" alt="Masterband" onerror="this.style.display='none'"><div><h1>Portal Masterband</h1></div></div>
    <p class="sub">Selecciona tu perfil e ingresa tu contraseña.</p>
    <div class="roles" id="roles"></div>
    <div class="lfield">
      <label>Contraseña</label>
      <input type="password" id="pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <button class="lbtn" onclick="entrar()">Ingresar</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sbrand">
        <img src="logo-masterband.png" alt="MB" onerror="this.outerHTML='<b>MASTER<span>BAND</span></b>'">
      </div>
      <div id="nav"></div>
      <div class="sfoot">Montajes Industriales<br>Masterband S.A.S.</div>
    </aside>

    <!-- Topbar -->
    <header class="topbar">
      <button class="burger" onclick="toggleSidebar(true)">☰</button>
      <img class="tb-logo" src="logo-masterband.png" alt="Masterband" onerror="this.style.display='none'">
      <div class="tb-div"></div>
      <div class="ttl" id="pageTitle">Inicio<small>Portal de Gestión</small></div>
      <div class="sp"></div>
      <button class="syncbtn" onclick="sincronizar(this)">⟳ Sincronizar</button>
      <div class="userbox">
        <div class="ui"><b id="uName">—</b><span id="uRole">—</span></div>
        <div class="av" id="uAv">—</div>
        <button class="logout" onclick="salir()">Salir</button>
      </div>
    </header>

    <!-- Main -->
    <main class="main" id="main"></main>
  </div>
</div>

<dialog id="dayDlg"><div id="dayBody"></div></dialog>

<script>
/* ===================== CONFIG ===================== */
const BACKEND = "https://script.google.com/macros/s/AKfycbw8rE7Wemj-RU-jfu9BqVb_i0FyeMvfVZtDtJHdyEwyz-JsPWNbXatPf13AHG_vG7OS/exec";

/* ---------- Iconos corporativos (SVG de línea, estilo Lucide) ---------- */
const PATHS = {
  home:'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M9.5 21v-6h5v6',
  calendar:'M7 3v3M17 3v3M3.5 8.5h17M4 6h16v15H4zM8 12h3M14 12h2M8 16h3M14 16h2',
  clipboard:'M9 4h6v2.5H9zM7 5H5v16h14V5h-2M8.5 11h7M8.5 14.5h7M8.5 18h4',
  calendarDays:'M7 3v3M17 3v3M3.5 8.5h17M4 6h16v15H4zM8 12h.5M12 12h.5M16 12h.5M8 16h.5M12 16h.5',
  wallet:'M3 7a2 2 0 0 1 2-2h12v3M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-3M3 7h17a1 1 0 0 1 1 1v3h-5a2 2 0 0 0 0 4h5M16 13h.01',
  check:'M9 11.5l2 2 4-4M12 3l2.5 2 3.5-.3.5 3.4 2 2.9-2 2.9-.5 3.4-3.5-.3L12 21l-2.5-2-3.5.3-.5-3.4-2-2.9 2-2.9.5-3.4 3.5.3z',
  calculator:'M6 3h12v18H6zM9 7h6M8.5 11h.5M12 11h.5M15.5 11h.5M8.5 14h.5M12 14h.5M15.5 14v3.5M8.5 17.5h4',
  star:'M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L4.5 9.7l5.9-.9z',
  chart:'M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6M20 14l-4-5-4 3-4-4',
  grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20a7 7 0 0 1 14 0',
  bank:'M4 10h16M5 10l7-5 7 5M6 10v8M10 10v8M14 10v8M18 10v8M4 21h16',
  tools:'M14 7a3 3 0 0 0 4 3l3 3-4 4-3-3a3 3 0 0 0-3-4M10.5 10.5 4 17a2 2 0 0 0 3 3l6.5-6.5M14 7l-3-3',
  helmet:'M4 14a8 8 0 0 1 16 0M3 14h18v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM12 6V4M9 14V9h6v5',
  ruler:'M15.5 3.5 3.5 15.5l5 5 12-12zM7 12l2 2M10 9l2 2M13 6l2 2'
};
function ic(name, size){
  const p=PATHS[name]; if(!p) return '';
  const s=size||18;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px">${p.split('M').filter(Boolean).map(seg=>`<path d="M${seg}"/>`).join('')}</svg>`;
}

const PASS = { gerencia:'master2025', ingeniero:'ing2025', supervisor:'sup2025', dibujante:'dib2025' };
const ROLES = {
  gerencia:  {nombre:'Gerencia',  ic:'bank',   desc:'Acceso completo'},
  ingeniero: {nombre:'Ingeniero', ic:'tools',  desc:'Ejecución y OTs'},
  supervisor:{nombre:'Supervisor',ic:'helmet', desc:'Programa su personal'},
  dibujante: {nombre:'Dibujante', ic:'ruler',  desc:'Registra entregas'}
};

/* Registro de módulos */
const MOD = {
  inicio:      {label:'Inicio',               ic:'home',         type:'home'},
  calendario:  {label:'Calendario',           ic:'calendar',     type:'calendar'},
  ots:         {label:'Órdenes de Trabajo',   ic:'clipboard',    file:'Masterband_OTs.html',            code:'MB-01', desc:'Cotizaciones, OTs y actas'},
  programacion:{label:'Programación',          ic:'calendarDays', file:'Masterband_Programacion.html',    code:'MB-02', desc:'Programa el personal por día'},
  ordenes:     {label:'Órdenes Abiertas',     ic:'wallet',       file:'Masterband_OrdenesAbiertas.html', code:'MB-05', desc:'Saldos por orden y área'},
  cotizador:   {label:'Cotizador de Servicio',ic:'calculator',   file:'Masterband_CotizadorServicio.html',code:'MB-06', desc:'Estima costos de servicio'},
  solicitudes: {label:'Solicitudes',          ic:'check',        file:'Masterband_Solicitudes.html',     code:'MB-07', desc:'Aprueba solicitudes de clientes'},
  evaluacion:  {label:'Evaluación',           ic:'star',         file:'Masterband_Evaluacion.html',       code:'MB-03', desc:'Evalúa el desempeño del equipo'},
  desempeno:   {label:'Mi Desempeño',         ic:'chart',        file:'Masterband_MiDesempeno.html',     code:'MB-04', desc:'Tus indicadores y registros'}
};

/* Qué ve cada rol (en orden del menú) */
const NAV = {
  gerencia:   ['inicio','calendario','ots','programacion','ordenes','solicitudes','cotizador','evaluacion'],
  ingeniero:  ['inicio','calendario','ots','programacion','desempeno'],
  supervisor: ['inicio','calendario','programacion','desempeno'],
  dibujante:  ['inicio','desempeno']
};
/* Secciones del menú */
const SECCIONES = [
  {lbl:'Principal',  ic:'home', keys:['inicio','calendario']},
  {lbl:'Operación',  ic:'grid', keys:['ots','programacion','ordenes','solicitudes','cotizador','evaluacion']},
  {lbl:'Mi espacio', ic:'user', keys:['desempeno']}
];

/* Festivos Colombia 2026 */
const FESTIVOS = {"2026-01-01":"Año Nuevo","2026-01-12":"Reyes","2026-03-23":"San José","2026-04-02":"J. Santo","2026-04-03":"V. Santo","2026-05-01":"Trabajo","2026-05-18":"Ascensión","2026-06-08":"Corpus","2026-06-15":"S. Corazón","2026-06-29":"S. Pedro","2026-07-20":"Independencia","2026-08-07":"Boyacá","2026-08-17":"Asunción","2026-10-12":"Raza","2026-11-02":"Todos Santos","2026-11-16":"Cartagena","2026-12-08":"Inmaculada","2026-12-25":"Navidad"};

/* ===================== ESTADO ===================== */
let ROLE=null, selRole=null, PROG=null, calRef=new Date();
const $ = id => document.getElementById(id);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* ===================== LOGIN ===================== */
function pintarRoles(){
  $('roles').innerHTML = Object.keys(ROLES).map(k=>`
    <div class="role" data-r="${k}" onclick="pickRole('${k}')">
      <div class="ic">${ic(ROLES[k].ic,22)}</div><div class="nm">${ROLES[k].nombre}</div><div class="ds">${ROLES[k].desc}</div>
    </div>`).join('');
}
function pickRole(k){ selRole=k; document.querySelectorAll('.role').forEach(e=>e.classList.toggle('on',e.dataset.r===k)); $('pwd').focus(); }
function entrar(){
  if(!selRole){ $('lerr').textContent='Selecciona tu perfil.'; return; }
  if($('pwd').value !== PASS[selRole]){ $('lerr').textContent='Contraseña incorrecta.'; return; }
  try{ sessionStorage.setItem('mb_role', selRole); }catch(e){}
  iniciar(selRole);
}
function salir(){ try{ sessionStorage.removeItem('mb_role'); }catch(e){}; location.reload(); }

/* ===================== INICIAR APP ===================== */
function iniciar(role){
  ROLE=role;
  $('login').style.display='none';
  $('app').style.display='block';
  const r=ROLES[role];
  $('uName').textContent = r.nombre;
  $('uRole').textContent = 'Perfil activo';
  $('uAv').textContent = r.nombre.slice(0,2).toUpperCase();
  pintarMenu();
  const first = (location.hash||'').replace('#','');
  ir(NAV[role].includes(first)?first:'inicio');
}

function pintarMenu(){
  const permit = NAV[ROLE];
  let html='';
  SECCIONES.forEach(sec=>{
    const items = sec.keys.filter(k=>permit.includes(k));
    if(!items.length) return;
    html += `<div class="navsec"><div class="lbl">${ic(sec.ic,13)} ${sec.lbl}</div>` +
      items.map(k=>`
        <div class="navitem" data-k="${k}" onclick="ir('${k}')">
          <span class="ic">${ic(MOD[k].ic)}</span><span>${MOD[k].label}</span>
          ${MOD[k].code?`<span class="code">${MOD[k].code}</span>`:''}
        </div>`).join('') + `</div>`;
  });
  $('nav').innerHTML=html;
}

/* ===================== NAVEGACIÓN ===================== */
function ir(key){
  if(!NAV[ROLE].includes(key)) key='inicio';
  location.hash=key;
  document.querySelectorAll('.navitem').forEach(e=>e.classList.toggle('on',e.dataset.k===key));
  $('pageTitle').innerHTML = `${MOD[key].label}<small>${MOD[key].desc||'Sistema Interno de Gestión'}</small>`;
  toggleSidebar(false);
  const m=MOD[key];
  if(m.type==='home') renderHome();
  else if(m.type==='calendar') renderCalendar();
  else { const sep=m.file.includes('?')?'&':'?'; $('main').innerHTML = `<iframe class="modframe" src="${m.file}${sep}embed=1&rol=${encodeURIComponent(ROLE)}" title="${m.label}"></iframe>`; }
}
function toggleSidebar(open){
  if(window.innerWidth>820) return;
  $('sidebar').classList.toggle('open',open);
  $('scrim').classList.toggle('on',open);
}

/* ===================== INICIO ===================== */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function contarPersonal(txt){
  return String(txt||'').split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean).length;
}

/* ---------- Datos de OTs (actas) para el resumen ---------- */
const _cacheH={};
async function cargarOTs(){
  if(_cacheH.ots) return _cacheH.ots;
  try{ const r=await fetch(BACKEND+'?nocache='+Date.now(),{cache:'no-store'}); const d=await r.json(); _cacheH.ots=Array.isArray(d)?d:[]; }
  catch(e){ _cacheH.ots=[]; }
  return _cacheH.ots;
}
function mapEtapaH(estado,apro,noOC,etrab,facturado,nfact){
  const e=(estado||'').toLowerCase().trim(),a=(apro||'').toLowerCase().trim(),t=(etrab||'').toLowerCase().trim(),f=(facturado||'').toLowerCase().trim();
  const nf=(nfact||'').trim(); const facReal=/\d{3,}/.test(nf)&&!/pdte|pend|validar|revisar|no\.?\s*e|falta/i.test(nf);
  if(f==='si'||f==='sí'||facReal) return 6;
  if(t==='finalizado') return 5;
  if(t==='en proceso'&&(noOC||'').trim()) return 4;
  if((noOC||'').trim()) return 3;
  if(a==='si'||a==='sí') return 2;
  if(e==='enviada') return 1;
  return 0;
}
function parseFDMA(s){ if(!s)return null; s=String(s).trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m)return new Date(+m[3],+m[2]-1,+m[1]); m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]); return null; }
function diasFin(s){ const f=parseFDMA(s); if(!f)return null; const h=new Date();h.setHours(0,0,0,0);f.setHours(0,0,0,0); return Math.max(0,Math.round((h-f)/864e5)); }
function otsResumen(data){
  let activos=0,enProceso=0,finalizados=0,actaPend=0,vencidas=0,frenadosNE=0,listos=0;
  for(let i=1;i<data.length;i++){ const row=data[i]||[]; const a=String(row[0]||'').trim();
    if(/[a-zA-Z]/.test(a)) continue; if(/\d{4}-\d{2}-\d{2}T/.test(a)) continue;
    const num=a.replace(/[^0-9]/g,''); if(!num||num.length<3||num.length>6) continue;
    const et=mapEtapaH(String(row[7]||''),String(row[8]||''),String(row[9]||''),String(row[10]||''),String(row[12]||''),String(row[14]||''));
    if(et>=3&&et<6) activos++;
    if(et===4) enProceso++;
    if(et===5){ finalizados++;
      const acta=['SI','SÍ'].indexOf(String(row[13]||'').toUpperCase().trim())>=0;
      const neRaw=String(row[15]||'').trim();                 // col P = N° ENTRADA
      const nePres=/\d/.test(neRaw) && !/pdte|pend|falta|validar|^no$/i.test(neRaw);
      const facRaw=String(row[12]||'').toUpperCase().trim();
      const facturado=(facRaw==='SI'||facRaw==='SÍ');
      if(!acta){ actaPend++; if((diasFin(String(row[17]||''))||0)>5) vencidas++; }
      else if(!facturado){ if(nePres) listos++; else frenadosNE++; }
    }
  }
  return {activos,enProceso,finalizados,actaPend,vencidas,frenadosNE,listos};
}
async function calProm(){
  try{ const mes=new Date().toISOString().slice(0,7);
    const d=await (await fetch(BACKEND+'?tabla=eval_datos&mes='+mes+'&t='+Date.now())).json();
    return (d&&d.ok&&d.ingeniero&&d.ingeniero.calProm!=null)?d.ingeniero.calProm:null;
  }catch(e){ return null; }
}
function kpiCard(color,title,val,sub,action,highlight){
  return `<div class="kpi"${highlight?' style="outline:2px solid var(--rojo);outline-offset:-1px"':''}>
    <div class="kh"><span class="kd" style="background:${color}"></span>${title}</div>
    <div class="kv">${val}</div><div class="ks">${sub}</div>
    ${action?`<div class="ka" onclick="${action.fn}">${action.txt} →</div>`:''}</div>`;
}

async function renderHome(){
  const r=ROLES[ROLE];
  const now=new Date();
  const saludo = now.getHours()<12?'Buenos días':now.getHours()<19?'Buenas tardes':'Buenas noches';
  const fechaTxt = `${cap(DIAS[now.getDay()])}, ${now.getDate()} de ${MESES[now.getMonth()]} de ${now.getFullYear()} · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const resumenTit={gerencia:'Resumen general',ingeniero:'Resumen de Ingeniería',supervisor:'Resumen de Campo',dibujante:'Resumen de Diseño'}[ROLE]||'Resumen';
  const mods = NAV[ROLE].filter(k=>MOD[k].file);

  let html = `<div class="pagepad">
    <div class="hero">
      <h2>${saludo}, ${r.nombre}</h2>
      <div class="sub">${resumenTit} · ${fechaTxt}</div>
      <div class="chips" id="heroChips">
        <span class="chip2">${ic('calendar',15)} <b>${now.getDate()} ${MESES[now.getMonth()].slice(0,3).toUpperCase()} ${now.getFullYear()}</b></span>
        <span class="chip2" id="chipA">${ic('clipboard',15)} <b>—</b></span>
        <span class="chip2" id="chipB">${ic('star',15)} <b>—</b></span>
      </div>
    </div>
    <div class="kpis" id="kpis"><div class="kpi"><div class="kv">…</div><div class="ks">cargando indicadores…</div></div></div>
    <div class="sechead">${ic('grid',16)} Accesos de tu perfil</div>
    <div class="mods">`;
  mods.forEach(k=>{ const m=MOD[k];
    html += `<div class="modcard" onclick="ir('${k}')">
      <span class="code">${m.code||''}</span>
      <div class="mic">${ic(m.ic,24)}</div><h3>${m.label}</h3><p>${m.desc||''}</p>
      <div class="go">Abrir módulo →</div></div>`;
  });
  html += `</div></div>`;
  $('main').innerHTML=html;

  const chip=(id,h)=>{ const e=$(id); if(e) e.innerHTML=h; };

  // ===== Resumen por ROL =====
  if(ROLE==='ingeniero' || ROLE==='gerencia'){
    const o=otsResumen(await cargarOTs());
    const calTgt = NAV[ROLE].includes('evaluacion')?'evaluacion':(NAV[ROLE].includes('desempeno')?'desempeno':'ots');
    const cp=await calProm();
    $('kpis').innerHTML =
      kpiCard('#B91C1C','Frenados por NE',o.frenadosNE,'acta lista, sin N° entrada',{fn:"ir('ots')",txt:'Perseguir NE'}, o.frenadosNE>0) +
      kpiCard('var(--verde)','Listos para facturar',o.listos,'acta + NE, sin facturar',{fn:"ir('ots')",txt:'Ver'}) +
      kpiCard('var(--rojo)','Actas pendientes',o.actaPend,(o.vencidas?o.vencidas+' vencidas (+5 días)':'al día'),{fn:"ir('ots')",txt:'Generar actas'}, o.vencidas>0) +
      kpiCard('var(--azul)','Calificación cliente',(cp!=null?cp+'/10':'—'),'promedio del mes',{fn:"ir('"+calTgt+"')",txt:'Ver'});
    chip('chipA',`${ic('clipboard',15)} <b>${o.frenadosNE}</b> frenados por NE`);
    chip('chipB',`${ic('star',15)} <b>${o.listos}</b> listos para facturar`);
  }
  else if(ROLE==='supervisor'){
    const prog=await cargarProg(); const hoyISO=iso(new Date());
    const wkS=new Date(); wkS.setDate(wkS.getDate()-((wkS.getDay()+6)%7)); wkS.setHours(0,0,0,0);
    const wkE=new Date(wkS); wkE.setDate(wkS.getDate()+6); wkE.setHours(23,59,59,999);
    let fHoy=0,pHoy=0,fSem=0,iHoy=0;
    prog.forEach(p=>{ if(!p.fecha)return; const d=new Date(p.fecha+'T00:00:00'); if(isNaN(d))return;
      if(p.fecha===hoyISO){ fHoy++; pHoy+=contarPersonal(p.personal); if(p.inasistencias) iHoy+=contarPersonal(p.inasistencias);} if(d>=wkS&&d<=wkE)fSem++; });
    $('kpis').innerHTML =
      kpiCard('var(--rojo)','Frentes hoy',fHoy,'trabajos programados',{fn:"ir('calendario')",txt:'Ver calendario'}) +
      kpiCard('var(--verde)','Personal hoy',pHoy,'colaboradores asignados',{fn:"ir('programacion')",txt:'Programar'}) +
      kpiCard('var(--azul)','Esta semana',fSem,'frentes de lun a dom',{fn:"ir('calendario')",txt:'Ver semana'}) +
      kpiCard('var(--naranja)','Inasistencias hoy',iHoy,'registradas en el día',null, iHoy>0);
    chip('chipA',`${ic('clipboard',15)} <b>${fHoy}</b> frentes hoy`);
    chip('chipB',`${ic('user',15)} <b>${pHoy}</b> programados hoy`);
  }
  else if(ROLE==='dibujante'){
    let ent='—',pct='—';
    try{ const d=await (await fetch(BACKEND+'?tabla=mi_desempeno&rol=dibujante&meses=1&t='+Date.now())).json();
      const o=(d&&d.dibujante&&d.dibujante.existe)?d.dibujante:(d&&d.serie&&d.serie.length?d.serie[d.serie.length-1]:null);
      if(o){ ent=(o.entregas!=null?o.entregas:'—'); if(o.entregas){ pct=Math.round((o.aTiempo||0)/o.entregas*100)+'%'; } }
    }catch(e){}
    $('kpis').innerHTML =
      kpiCard('var(--rojo)','Entregas del mes',ent,'planos entregados',{fn:"ir('desempeno')",txt:'Registrar entrega'}) +
      kpiCard('var(--verde)','% a tiempo',pct,'cumplimiento de fechas',{fn:"ir('desempeno')",txt:'Ver detalle'});
    chip('chipA',`${ic('clipboard',15)} <b>${ent}</b> entregas del mes`);
    chip('chipB',`${ic('star',15)} <b>${pct}</b> a tiempo`);
  }
}

function sincronizar(btn){
  PROG=null; if(typeof _cacheH!=='undefined') _cacheH.ots=null;
  if(btn){ btn.disabled=true; const o=btn.innerHTML; btn.innerHTML='⟳ Sincronizando…'; setTimeout(()=>{btn.disabled=false;btn.innerHTML=o;},1200); }
  const key=(location.hash||'#inicio').replace('#','');
  if(key==='calendario') renderCalendar(); else if(key===''||key==='inicio') renderHome();
}

/* ===================== CALENDARIO ===================== */
async function cargarProg(){
  if(PROG) return PROG;
  try{
    const r=await fetch(BACKEND+"?tabla=programacion&t="+Date.now());
    const j=await r.json();
    PROG = Array.isArray(j)?j:(j.datos||[]);
  }catch(e){ PROG=[]; }
  return PROG;
}
async function renderCalendar(){
  $('main').innerHTML = `<div class="pagepad"><div class="phead"><h2>Calendario</h2><p>Programación de personal por día.</p></div><div class="loading">Cargando programación…</div></div>`;
  const prog = await cargarProg();
  dibujarCalendario(prog);
}
function porFecha(prog){
  const map={};
  prog.forEach(p=>{ if(!p.fecha) return; (map[p.fecha]=map[p.fecha]||[]).push(p); });
  return map;
}
function dibujarCalendario(prog){
  const map=porFecha(prog);
  const y=calRef.getFullYear(), mo=calRef.getMonth();
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const hoyISO=iso(new Date());

  // métricas del mes
  let nMes=0, nHoy=0, nSemana=0, nIna=0;
  const now=new Date(); const wkStart=new Date(now); wkStart.setDate(now.getDate()-((now.getDay()+6)%7)); const wkEnd=new Date(wkStart); wkEnd.setDate(wkStart.getDate()+6);
  prog.forEach(p=>{
    const d=new Date(p.fecha+'T00:00:00'); if(isNaN(d))return;
    if(d.getFullYear()===y && d.getMonth()===mo){ nMes++; if(p.inasistencias) nIna++; }
    if(p.fecha===hoyISO) nHoy++;
    if(d>=wkStart && d<=wkEnd) nSemana++;
  });

  let html = `<div class="pagepad">
    <div class="phead"><h2>Calendario</h2><p>Programación de personal por día — datos en vivo.</p></div>
    <div class="tiles">
      <div class="tile"><div class="dot" style="background:var(--rojo-l);color:var(--rojo)">${ic('clipboard',16)}</div><b>${nMes}</b><span>Programados (mes)</span></div>
      <div class="tile"><div class="dot" style="background:#F0F4FF;color:var(--azul)">${ic('home',16)}</div><b>${nHoy}</b><span>Hoy</span></div>
      <div class="tile"><div class="dot" style="background:var(--verde-l);color:var(--verde)">${ic('calendarDays',16)}</div><b>${nSemana}</b><span>Esta semana</span></div>
      <div class="tile"><div class="dot" style="background:#FDECEC;color:#B91C1C">${ic('user',16)}</div><b>${nIna}</b><span>Inasistencias (mes)</span></div>
    </div>
    <div class="calbar">
      <button class="navb" onclick="mesCal(-1)">← Ant.</button>
      <div class="mn">${meses[mo]} ${y}</div>
      <button class="navb" onclick="mesCal(1)">Sig. →</button>
      <button class="navb" onclick="hoyCal()" style="margin-left:6px">Hoy</button>
    </div>
    <div class="cal">
      <div class="calhead">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="calgrid">`;

  const first=new Date(y,mo,1); const lead=(first.getDay()+6)%7; const dim=new Date(y,mo+1,0).getDate();
  for(let i=0;i<lead;i++) html+=`<div class="cell empty"></div>`;
  for(let d=1; d<=dim; d++){
    const dateISO=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=map[dateISO]||[];
    const fest=FESTIVOS[dateISO];
    const cls=['cell']; if(dateISO===hoyISO)cls.push('today'); if(fest)cls.push('festivo');
    const hayIna=evs.some(e=>e.inasistencias);
    let chips=evs.slice(0,2).map(e=>`<div class="chip" title="${(e.nombre||'').replace(/"/g,'')}">${e.hora?e.hora+' ':''}${e.nombre||'Frente'}</div>`).join('');
    if(evs.length>2) chips+=`<div class="chip mas">+${evs.length-2} más</div>`;
    html+=`<div class="${cls.join(' ')}" ${evs.length?`onclick="verDia('${dateISO}')"`:''}>
      <div class="dnum">${d}</div>${fest?`<div class="fest">${fest}</div>`:''}
      ${hayIna?'<span class="ina" title="Inasistencias"></span>':''}
      <div class="ev">${chips}</div></div>`;
  }
  html+=`</div></div>
    <div class="leg">
      <span><i style="background:var(--rojo-l)"></i>Frente programado</span>
      <span><i style="background:#F0F4FF"></i>Hoy</span>
      <span><i style="background:#F6F2FF"></i>Festivo</span>
      <span><i style="background:var(--rojo)"></i>Con inasistencia</span>
    </div></div>`;
  $('main').innerHTML=html;
}
function mesCal(delta){ calRef.setMonth(calRef.getMonth()+delta); dibujarCalendario(PROG||[]); }
function hoyCal(){ calRef=new Date(); dibujarCalendario(PROG||[]); }

function verDia(dateISO){
  const evs=(porFecha(PROG||[])[dateISO])||[];
  const [Y,M,D]=dateISO.split('-'); const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const dt=new Date(dateISO+'T00:00:00');
  let body=`<div class="dlgh"><h3>${dias[dt.getDay()]} ${+D} de ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+M-1]}. ${Y}</h3>
    <button onclick="dayDlg.close()">✕</button></div><div class="dlgb">`;
  if(!evs.length){ body+='<div class="empty-s">Sin programación este día.</div>'; }
  else evs.forEach(e=>{
    body+=`<div class="fr"><div class="frt"><h4>${e.nombre||'Frente'}</h4>${e.hora?`<span class="hr">${e.hora}</span>`:''}</div>
      <div class="meta">
        ${e.tipo?`<span class="tag">${e.tipo}</span>`:''}${e.jornada?`<span class="tag">${e.jornada}</span>`:''}<br>
        ${e.siso?`<b>SISO:</b> ${e.siso}<br>`:''}
        ${e.personal?`<b>Personal:</b> ${e.personal}<br>`:''}
        ${e.responsable?`<b>Responsable:</b> ${e.responsable}<br>`:''}
        ${e.materiales?`<b>Materiales:</b> ${e.materiales}<br>`:''}
        ${e.inasistencias?`<b style="color:var(--rojo)">Inasistencias:</b> ${e.inasistencias}`:''}
      </div></div>`;
  });
  body+='</div>';
  $('dayBody').innerHTML=body;
  $('dayDlg').showModal();
}

(function(){
  pintarRoles();
  let saved=null; try{ saved=sessionStorage.getItem('mb_role'); }catch(e){}

  window.addEventListener('hashchange',()=>{ if(ROLE){ const k=(location.hash||'').replace('#',''); if(NAV[ROLE].includes(k)) { document.querySelectorAll('.navitem').forEach(e=>e.classList.toggle('on',e.dataset.k===k)); } } });
